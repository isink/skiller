name: Mini Program checks

on:
  pull_request:
    paths:
      - "miniprogram/**"
      - ".github/workflows/miniprogram-checks.yml"
  push:
    branches:
      - master
    paths:
      - "miniprogram/**"
      - ".github/workflows/miniprogram-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci
      - run: npm test
