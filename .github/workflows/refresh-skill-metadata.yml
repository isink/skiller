name: Refresh skill metadata

on:
  # Supabase Cron owns the daily schedule. Keep this as an operator fallback.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-metadata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.SKILLER_GITHUB_TOKEN }}
      MAX_GITHUB_REQUESTS: "4500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm run refresh:metadata
